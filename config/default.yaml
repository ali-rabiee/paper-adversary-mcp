# Default pipeline configuration: settings shared by every preset.
#
# Who reviews (agents, models, efforts, lenses, verification and follow-up limits) comes from a preset in
# config/presets/<name>.yaml; `preset` below is the default for new runs. Model names are aliases resolved
# through config/models.yaml, so no model ID is hard-coded in the orchestration code.
#
# Order of precedence (later wins): this file -> the preset -> $PAPER_ADVERSARY_CONFIG (your standing,
# trusted settings) -> `--trusted-config FILE` on the CLI (trusted) -> a run's `config_override` (per run,
# restricted: it may not raise agent counts or limits, enable max effort, or touch protected keys).
#
# effort: low | medium | high | xhigh | max   (passed to `claude --effort`)

preset: routine          # routine | milestone | legacy_thorough (config/presets/)
presets:
  selectable: [routine, milestone, legacy_thorough]   # presets a run may pick; trusted settings only

rubric: default_v1       # prompts/rubrics/<name>.md, or pass rubric text/path per run

provider:
  type: claude_code      # claude_code (your Claude plan, headless `claude -p`) | mock (offline testing)
  claude_binary: null    # null = find `claude` on PATH, then ~/.local/bin/claude
  allow_api_key: false   # never let a child process bill ANTHROPIC_API_KEY instead of your plan
  safe_mode: true        # --safe-mode: no CLAUDE.md, skills, plugins, hooks or user MCP servers in agents
  pdf_delivery: read_tool   # read_tool (PDF copied into the agent's sandbox, Read tool only)
  preflight: probe       # probe | auth_only | off   (probe = tiny low-effort call per distinct model)
  probe_cache_hours: 24
  idle_timeout_minutes: 25  # kill an agent whose stream is silent this long, then retry
  env_passthrough: []    # extra environment variables to hand to agent processes
  extra_args: []         # extra `claude` CLI flags for every agent

concurrency:
  max_parallel_agents: 3 # plan-friendly; raise it if your plan tolerates more parallel sessions
  stagger_seconds: 3

retry:
  max_attempts: 4
  base_delay_seconds: 30
  max_delay_seconds: 900
  jitter: 0.25

plan_limit:
  policy: wait           # wait (sleep until the limit resets, then continue) | fail
  max_waits_per_run: 1   # automatic waits per run; after that the job stops with a resumable state
  max_wait_hours: 6
  default_wait_minutes: 30   # when the reset time cannot be parsed
  model_window_reserve: 0    # share of a model-specific window (Fable's weekly) a run needs; before a run's first
                             # agent on that model, last known use + this must stay <= 100%. 0 = no check. Trusted only.

search:
  providers: [openalex, semantic_scholar, arxiv, crossref]
  max_results: 10
  cache_ttl_days: 14
  refcheck: true         # verify every reference cited by novelty refuters
  refcheck_max_refs: 60
  web_search: true
  web_fetch: true
  fulltext:              # open full texts of prior work, so quotes can be checked verbatim
    enabled: true
    host_policy: allowlist   # allowlist (arXiv + open ML proceedings + PMC) | arxiv_only; not settable per run
    allow_hosts: []          # extra hosts to allow; not settable per run
    max_pdf_mb: 30
    max_html_mb: 10
    max_pages: 80
    extract_timeout_seconds: 180
    arxiv_document_interval_seconds: 15   # arxiv.org robots.txt crawl-delay
    host_interval_seconds: 2
    ttl_days: 90
    negative_ttl_days: 3
    offline: false

evidence:                # when a FATAL/MAJOR verdict on prior work counts as shown (evidence gate); not settable per run
  require_independent_check: true   # a blind verifier who finds the anticipation, with its own quotes verified
                                    # (false: the refuter's verified quotes suffice; also used when no verifier runs)
  accept_approximate_score: 1.01    # >1 = only verbatim quotes count; e.g. 0.95 also accepts near-verbatim ones
  min_prior_words: 12
  min_submission_words: 8
  max_words: 80

verifier:                # the rest of the verifier section (models, per-run caps) comes from the preset
  # Each kind of verification batch has its own budget, so the refuters' batch (verifier.max_papers_per_run and
  # max_agents_per_run, set by the preset) cannot use up what follow-up rounds and gate re-checks need.
  # Trusted limits: a per-run override may lower them, never raise them.
  max_papers_per_followup_round: 2   # prior papers verified for one follow-up round's critic items
  max_agents_per_followup_round: 2
  max_papers_per_user_batch: 2       # each run_verification batch (from_gate or your own requests)
  max_agents_per_user_batch: 2
  auto_gate_batch: false   # true: right after the judges, one gate batch for objections the judges escalated that
                           # were never sent for an independent check (within the batch budget above)

budget:
  chars_per_token: 3.2   # conservative heuristic; replaced by a calibrated ratio once agents report usage
  safety_margin_tokens: 12000
  output_reserve_tokens: 64000
  # Which sections stay inline when a paper must be split (sectioned mode).
  # The remaining sections stay available to the agent through a read_paper_section tool.
  section_priority:
    default: [title, abstract, introduction, method, theory, experiments, results, limitations, conclusion, related_work, references, appendix, other]
    intake: [title, abstract, introduction, method, theory, experiments, results, limitations, conclusion, related_work, appendix, other, references]
    novelty: [title, abstract, introduction, related_work, references, method, conclusion, experiments, results, limitations, theory, appendix, other]
    verifier: [title, abstract, introduction, method, theory, results, experiments, conclusion, related_work, limitations, appendix, other, references]
    prior: [title, abstract, introduction, method, theory, experiments, results, related_work, conclusion, limitations, appendix, other, references]
    rigor: [title, abstract, method, theory, experiments, results, introduction, limitations, appendix, conclusion, related_work, other, references]
    fit: [title, abstract, experiments, results, method, introduction, limitations, appendix, conclusion, theory, related_work, other, references]

gates:                   # checks every agent's output must pass before later stages may read it
  # Only gates.repair.model / effort / timeout_minutes may be changed per run (config_override);
  # everything else here can be set only in this file or in $PAPER_ADVERSARY_CONFIG.
  audit:
    unverifiable: quarantine   # quarantine | warn  (a failed audit always quarantines)
    auto_rerun: 1              # fresh reruns per agent after a failed or unverifiable audit (0 or 1)
    max_auto_reruns_per_job: 2
  model_substitution: block    # block | warn: another model answered than the one configured
  truncation: block            # block | warn: report cut at the output-token limit (warn if its JSON is intact)
  structured:
    model_repair: true         # missing/invalid JSON: free fixes first, then a repair call for these roles
    repair_first: [intake, novelty]
  judge_coverage:
    min_fraction: 1.0          # every objection (adjudicators: every routed item) classified, after a supplement
    objection_index: true      # list every objection ID in each judge's assignment
  coverage_supplement:         # IDs a judge or adjudicator left out, or gave two severities: one targeted call on
    enabled: true              # its own model, seeing only the reports that raised them; still incomplete -> quarantine
    prompt: coverage_supplement_v1
    timeout_minutes: 45
    max_attempts: 2
  placement_fix:               # a memo that lists an unverified threat as surviving, or leaves it out of
    enabled: true              # 'Unverified threats': one call on its own model rewriting only those two sections,
    prompt: placement_fix_v1   # spliced in and re-checked; still wrong -> quarantine
    timeout_minutes: 45
    max_attempts: 2
  sections:
    synthesis: block_incomplete   # block_any | block_incomplete | warn
    critic: warn
  repair:                      # format-repair call: transcribes a report into JSON; validated, never adds content
    model: opus-5.5
    effort: low
    prompt: repair_v1
    timeout_minutes: 10
    max_attempts: 2
